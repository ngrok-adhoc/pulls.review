name: pulls.review
description: Analyze a pull request with pulls.review and post the grouped summary as a PR comment.
author: Anthony Fu
branding:
  icon: eye
  color: orange

inputs:
  github-token:
    description: 'Token with `pull-requests: write`. Comments are posted as its user (github-actions[bot] for the default token).'
    default: ${{ github.token }}
  provider:
    description: '`gateway`, `anthropic` or `openai-compatible`. Defaults to whichever key is set.'
  api-key:
    description: API key or gateway token for the provider.
    required: true
  model:
    description: Model id for the provider (the provider's default when empty).
  base-url:
    description: Endpoint for `openai-compatible` providers.
  locale:
    description: BCP 47 tag the summaries are written in (default `en`).

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # Build the CLI from this checkout of the action, not from the npm package,
    # so that the run uses the same reviewed commit that the caller pins.
    - name: Build pulls.review
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install -g pnpm@12.9.1
        # --ignore-scripts skips the root `prepare` script (skills-npm), which fails
        # with "No agents detected" on a runner. `pnpm rebuild` then runs the
        # dependency build scripts that `allowBuilds` permits.
        pnpm install --frozen-lockfile --ignore-scripts --filter . --filter '@pulls.review/actions...'
        pnpm rebuild
        pnpm -F @pulls.review/core run build
        pnpm -F @pulls.review/actions run build

    - name: Analyze
      shell: bash
      run: node "${{ github.action_path }}/packages/actions/dist/index.mjs"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PULLS_REVIEW_PROVIDER: ${{ inputs.provider }}
        PULLS_REVIEW_API_KEY: ${{ inputs.api-key }}
        PULLS_REVIEW_MODEL: ${{ inputs.model }}
        PULLS_REVIEW_BASE_URL: ${{ inputs.base-url }}
        PULLS_REVIEW_LOCALE: ${{ inputs.locale }}
