# Traffic policy for the ngrok deploy of pulls.review.
#
# GitHub OAuth gates the site. ngrok gives the viewer's GitHub token to the
# container on /gh-api/ only, in the X-GitHub-OAuth-Token header. nginx sends
# it to api.github.com, so each viewer reads GitHub as themselves. The token
# never goes to the browser.
#
# Setup:
# - Create a GitHub OAuth app with the callback URL
#   https://<this host>/oauth2/callback.
# - Put its client ID and secret in the ngrok vault "pulls-review".
# - Remove the Google OAuth from the gateway. A policy permits one auth action.
on_http_request:
  - name: GitHub OAuth
    actions:
      - type: oauth
        config:
          provider: github
          client_id: ${secrets.get("pulls-review", "github-oauth-client-id")}
          client_secret: ${secrets.get("pulls-review", "github-oauth-client-secret")}
          # read:user is mandatory for the github provider. repo lets the token
          # read private repos, but it also permits writes.
          scopes:
            - read:user
            - user:email
            - repo

  # Any GitHub account passes the gate above. To permit only some accounts,
  # deny all other GitHub user IDs (from https://api.github.com/users/<login>).
  # - name: Allow listed GitHub users
  #   expressions:
  #     - "!(actions.ngrok.oauth.identity.provider_user_id in ['1234567'])"
  #   actions:
  #     - type: deny
  #       config:
  #         status_code: 403

  # A client must not set the token header itself.
  - name: Remove client token header
    actions:
      - type: remove-headers
        config:
          headers:
            - x-github-oauth-token

  - name: Add the GitHub token on the API proxy
    expressions:
      - "req.url.path.startsWith('/gh-api/')"
    actions:
      - type: add-headers
        config:
          headers:
            x-github-oauth-token: ${actions.ngrok.oauth.access_token}
